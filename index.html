      :root {
        --sat: 0px;
        --sab: 0px;
      }
      body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; overflow: hidden; }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Screen transitions */
      .screen-enter { animation: screenIn 0.25s ease-out; }
      @keyframes screenIn {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      /* Fade in for modals and elements */
      .animate-fade-in { animation: fadeIn 0.2s ease-out; }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* Slide up for bottom sheets */
      .animate-slide-up { animation: slideUp 0.3s ease-out; }
      @keyframes slideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
    </style>
